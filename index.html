<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="focus">
  <!-- Animated background blobs -->
  <div class="bg">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="card">
    <header class="top">
      <h1 class="logo">🍅 <span>pomo</span></h1>
      <div class="top-actions">
      <button class="icon-btn" id="musicBtn" aria-label="Toggle lo-fi music" title="Lo-fi music (M)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      </div>
    </header>

    <!-- Mode switcher with sliding pill -->
    <nav class="modes" role="tablist">
      <span class="pill" aria-hidden="true"></span>
      <button class="mode active" data-mode="focus" role="tab">Focus</button>
      <button class="mode" data-mode="short" role="tab">Short break</button>
      <button class="mode" data-mode="long" role="tab">Long break</button>
    </nav>

    <!-- Circular progress timer -->
    <section class="timer">
      <svg class="ring" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" class="stop1" />
            <stop offset="100%" class="stop2" />
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="150" cy="150" r="130" />
        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130" />
      </svg>
      <div class="timer-inner">
        <div class="time" id="time">25:00</div>
        <div class="label" id="label">Time to focus</div>
      </div>
    </section>

    <!-- Controls -->
    <div class="controls">
      <button class="icon-btn ghost" id="resetBtn" aria-label="Reset" title="Reset (R)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="main-btn" id="startBtn">
        <span id="startText">Start</span>
      </button>
      <button class="icon-btn ghost" id="skipBtn" aria-label="Skip" title="Skip (S)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>

    <!-- Session tracker -->
    <footer class="sessions">
      <div class="dots" id="dots"></div>
      <p class="count">Completed today: <strong id="count">0</strong></p>
      <p class="hint"><kbd>Space</kbd> start/pause · <kbd>R</kbd> reset · <kbd>S</kbd> skip · <kbd>M</kbd> music</p>
    </footer>
  </main>

  <!-- Settings modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h2>Settings</h2>
      <label>Focus (min)<input type="number" id="setFocus" min="1" max="120" /></label>
      <label>Short break (min)<input type="number" id="setShort" min="1" max="60" /></label>
      <label>Long break (min)<input type="number" id="setLong" min="1" max="60" /></label>
      <label>Long break every<input type="number" id="setEvery" min="2" max="10" /></label>
      <label class="toggle">Sound<input type="checkbox" id="setSound" /></label>
      <label class="toggle">Auto-start next<input type="checkbox" id="setAuto" /></label>
      <label class="toggle">Lo-fi music during focus<input type="checkbox" id="setMusic" /></label>
      <label>Music volume<input type="range" id="setVolume" min="0" max="1" step="0.05" /></label>
      <div class="modal-actions">
        <button class="text-btn" id="cancelBtn">Cancel</button>
        <button class="main-btn small" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="music.js"></script>
  <script src="script.js"></script>
</body>
</html>
